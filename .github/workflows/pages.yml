name: Update sunshine and publish
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 2,8,14,20 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: sunshine-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check daily aggregation
        run: python -m unittest discover -s tests
      - name: Refresh the common 00 UTC forecast run
        env:
          OPEN_METEO_API_KEY: ${{ secrets.OPEN_METEO_API_KEY }}
        run: python scripts/update_forecasts.py
      - name: Record the current forecast snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/forecast.json
          if ! git diff --cached --quiet; then
            git commit -m "Update sunshine forecast snapshot"
            git push
          fi
      - name: Prepare public files
        run: |
          mkdir _site
          cp index.html styles.css app.js _site/
          cp -R assets data _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
