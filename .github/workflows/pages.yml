name: Publish retired sunshine project
# Retired on 12 October 2026 following the forecaster-requested source review.
# No schedule, provider requests, forecast refreshes or snapshot commits.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: sunshine-pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check preserved calculation and quality tests
        run: python -m unittest discover -s tests
      - name: Validate preserved browser JavaScript
        run: node --check app.js
      - name: Prepare static retirement page and research archive
        run: |
          mkdir _site
          cp index.html styles.css app.js _site/
          cp -R assets data docs _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
