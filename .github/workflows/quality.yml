name: Validate sunshine comparison
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Python regression and reference integrity tests
        run: python -m unittest discover -s tests
      - name: JavaScript syntax check
        run: node --check app.js
